name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 2

      - name: Run full test suite (regression, unit, physics)
        run: ctest --test-dir build --output-on-failure

      - name: Single-point benchmark smoke test
        run: ./build/benchmark_point 125.1 173.1

      - name: Scan smoke test (small grid)
        run: |
          mkdir -p results
          ./build/generate_phase_diagram --numerical --mt-min 172 --mt-max 173 --mh-min 125 --mh-max 125.5 --step 0.5
          head -5 results/numerical_chunk_0.csv
